name: CI

# Trzy sprawdzenia, które ruleset/branch protection na bazie ustawia jako WYMAGANE:
#   synchronizacja — gałąź PR zawiera całą bazę (niezależnie od tego, czy autor ma hooki),
#   bramki         — lint + typecheck + build + testy (tools/bramki.sh).
# Dostosuj setup środowiska (Node/Python/…) w jobie `bramki`.

on:
  pull_request:
    branches: [{{BAZA}}]
  push:
    branches: [{{BAZA}}]

jobs:
  synchronizacja:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Gałąź zawiera całe origin/${{ github.base_ref }}
        run: |
          git fetch -q --no-tags origin "$GITHUB_BASE_REF"
          if git merge-base --is-ancestor "origin/$GITHUB_BASE_REF" HEAD; then
            echo "OK — gałąź zawiera całe origin/$GITHUB_BASE_REF."
          else
            brakuje=$(git rev-list --count "HEAD..origin/$GITHUB_BASE_REF")
            echo "::error::Gałąź nie zawiera $brakuje commit(ów) z origin/$GITHUB_BASE_REF. Scal bazę (tools/sync-z-bazy.sh), przebiegnij bramki i wypchnij ponownie."
            exit 1
          fi

  bramki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # --- DOSTOSUJ: przykład Node ---
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Bramki jakości
        run: tools/bramki.sh
