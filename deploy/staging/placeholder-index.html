<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bridge — staging</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0;
           min-height: 100vh; display: grid; place-items: center;
           background: hsl(210 20% 98%); color: hsl(215 28% 18%); }
    @media (prefers-color-scheme: dark) { body { background: hsl(215 28% 12%); color: hsl(210 20% 92%); } }
    .card { max-width: 34rem; padding: 2rem 2.5rem; text-align: center; }
    h1 { color: hsl(35 70% 45%); margin: 0 0 .5rem; }
    .status { margin-top: 1.25rem; padding: .6rem 1rem; border-radius: .5rem;
              font-family: ui-monospace, monospace; font-size: .9rem; }
    .ok { background: hsl(145 60% 90%); color: hsl(145 60% 22%); }
    .err { background: hsl(0 70% 92%); color: hsl(0 60% 35%); }
    small { opacity: .7; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Bridge — środowisko staging</h1>
    <p>Pipeline CI/CD działa. To placeholder Iteracji 0 — prawdziwa aplikacja pojawi się po Iteracji 1.</p>
    <div id="status" class="status">sprawdzam backend…</div>
    <p><small>test.agritires.eu · backend: 127.0.0.1:5001 (proxy /api)</small></p>
  </div>
  <script>
    fetch('/api/health').then(r => r.json()).then(d => {
      const el = document.getElementById('status');
      el.className = 'status ok';
      el.textContent = 'backend OK: ' + JSON.stringify(d);
    }).catch(e => {
      const el = document.getElementById('status');
      el.className = 'status err';
      el.textContent = 'backend nie odpowiada: ' + e;
    });
  </script>
</body>
</html>
